name: Playwright Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check if Playwright test files exist
        run: |
          if [ ! -d "./tests" ]; then
            echo "Tests directory does not exist. Skipping test execution."
            exit 0
          fi

          if [ ! -f "$(find ./tests -type f -name '*.spec.ts')" ]; then
            echo "No Playwright tests found. Skipping test execution."
            exit 0
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
